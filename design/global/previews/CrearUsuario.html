<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/sidebar.css"><link rel="stylesheet" href="/css/sarmedix-ui.css"><link rel="stylesheet" href="/css/sarmedix-orbita-v2.css"><link rel="stylesheet" href="/css/sarmedix-system.css"><link rel="stylesheet" href="/css/sarmedix-structural.css"><link rel="stylesheet" href="/css/sarmedix-refinement.css"><body class="sm-app" data-sm-screen="CrearUsuario" data-sm-family="users"><div style="padding:10px;background:#fff;color:#385575;font:13px system-ui">Vista estática sin datos · CrearUsuario · Formularios desconectados</div><main role="main" id="sm-main" style="width:100%;padding:24px;display:block">﻿





<header class="orbit-editor-heading"><span class="orbit-eyebrow">ÓRBITA / PERSONAS</span><h1>Ingrese los datos del nuevo usuario</h1></header>

<form
     
      method="post"
      class="formulario-principal"
      id="formCrearUsuario"
      novalidate data-orbit-form="CrearUsuario">

    <div class="espacio-mensaje">
        
        else
        {
            <div class="mensaje mensaje-error mensaje-oculto"
                 id="mensajeFormulario"></div>
        }
    </div>

    <div class="orbit-identity-grid"><fieldset><legend>01 · Identidad personal</legend><div class="grupo-campo">
        <label for="nombre">Nombre</label>
        <input
               id="nombre"
               autocomplete="off" />
    </div>

    <div class="grupo-campo">
        <label for="apellido">Apellido</label>
        <input
               id="apellido"
               autocomplete="off" />
    </div>

    <div class="grupo-campo">
        <label for="email">Correo electrónico</label>

        <input
               id="email"
               type="email"
               autocomplete="off" />

        <div id="estadoEmail"
             class="validacion-caliente"
             aria-live="polite">
        </div>
    </div>

    <div class="grupo-campo">
        <label for="rut">RUT</label>

        <input
               id="rut"
               maxlength="10"
               autocomplete="off" />

        <div id="estadoRut"
             class="validacion-caliente"
             aria-live="polite">
        </div>
    </div>

    </fieldset><fieldset class="orbit-credentials"><legend>02 · Perfil de acceso</legend><div class="grupo-campo">
        <label for="id_rol">Rol</label>

        <select
                id="id_rol">

            <option value="">
                Seleccione un rol
            </option>

            <option value="1">
                Administrador
            </option>

            <option value="2">
                TENS
            </option>

            <option value="3">
                Enfermera
            </option>

            <option value="4">
                Auxiliar
            </option>

        </select>
    </div>

    <div class="grupo-campo">
        <label for="nombre_usuario">
            Nombre de usuario
        </label>

        <input
               id="nombre_usuario"
               autocomplete="off" />

        <div id="estadoNombreUsuario"
             class="validacion-caliente"
             aria-live="polite">
        </div>
    </div>

    <div class="grupo-campo">
        <label for="contrasena">
            Contraseña
        </label>

        <input
               id="contrasena"
               type="password"
               autocomplete="new-password" />
    </div>

    <br />

    </fieldset></div><div class="orbit-form-actions"><button type="submit" data-orbit-action="primary">
        Crear usuario
    </button>

</div></form>


<div class="contenedor-volver">

    <a
      
       class="btn-volver-usuarios" data-orbit-action="secondary">

        ← Volver a Usuarios y Permisos

    </a>

</div>


<!-- =============================================================
     MODAL DE CONFIRMACION
     ============================================================= -->

<div id="modalConfirmacion"
     class="modal-fondo">

    <div class="modal-contenido" data-orbit-dialog="surface">

        <div class="modal-icono">
            ?
        </div>

        <h2>
            Confirmar acción
        </h2>

        <p>
            ¿Quieres crear este usuario?
        </p>

        <div class="modal-botones">

            <button type="button"
                    class="btn-modal-si"
                    data-orbit-action="primary">

                Sí

            </button>

            <button type="button"
                    class="btn-modal-no"
                    data-orbit-action="secondary">

                No

            </button>

            <button type="button"
                    class="btn-modal-cancelar"
                    data-orbit-action="secondary">

                Cancelar

            </button>

        </div>

    </div>

</div>


<style>

    /* =========================================================
           MENSAJES
           ========================================================= */

    .espacio-mensaje {
        min-height: 48px;
        margin-bottom: 8px;
    }


    .mensaje {
        width: 100%;
        padding: 12px 15px;
        border-radius: 7px;
        text-align: center;
        font-weight: 600;
        opacity: 1;
        transition: opacity 0.5s ease;
        box-sizing: border-box;
    }


    .mensaje-exito {
        background-color: #d1e7dd;
        color: #0f5132;
        border: 1px solid #badbcc;
    }


    .mensaje-error {
        background-color: #f8d7da;
        color: #842029;
        border: 1px solid #f5c2c7;
    }


    .mensaje-oculto {
        visibility: hidden;
    }



    /* =========================================================
           CAMPOS
           ========================================================= */

    .grupo-campo {
        width: 100%;
        margin-bottom: 18px;
    }


        .grupo-campo label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }


    .formulario-principal input,
    .formulario-principal select {
        width: 100%;
        height: 54px;
        padding: 0 16px;
        border: 1px solid #b8cfe0;
        border-radius: 10px;
        font-size: 16px;
        background-color: white;
        box-sizing: border-box;
        outline: none;
    }


        .formulario-principal input:focus,
        .formulario-principal select:focus {
            border-color: #1198a5;
            box-shadow: 0 0 0 3px rgba( 17, 152, 165, 0.15 );
        }



    /* =========================================================
           VALIDACION EN CALIENTE
           ========================================================= */

    .validacion-caliente {
        min-height: 22px;
        margin-top: 7px;
        display: flex;
        align-items: center;
        gap: 7px;
        color: #73838c;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
    }


        .validacion-caliente:empty {
            min-height: 0;
            margin-top: 0;
        }


    .validacion-verificando {
        color: #627985;
    }


    .validacion-correcta {
        color: #198754;
    }


    .validacion-error {
        color: #b42318;
    }


    .validacion-incompleta {
        color: #7a8991;
    }



    /* =========================================================
           SPINNER
           =========================================================
           La animacion se hace directamente mediante SVG.
           Así evitamos usar reglas CSS especiales que Razor
           podría intentar interpretar.
           ========================================================= */

    .validacion-spinner {
        width: 16px;
        height: 16px;
        min-width: 16px;
        display: inline-block;
    }



    /* =========================================================
           ICONOS OK / ERROR
           ========================================================= */

    .validacion-icono-ok,
    .validacion-icono-error {
        width: 17px;
        height: 17px;
        min-width: 17px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: white;
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
    }


    .validacion-icono-ok {
        background-color: #198754;
    }


    .validacion-icono-error {
        background-color: #dc3545;
    }



    /* =========================================================
           CAMPO DISPONIBLE
           ========================================================= */

    .formulario-principal
    input.campo-disponible {
        border-color: #55b984;
        background-color: #fbfffc;
        box-shadow: 0 0 0 3px rgba( 25, 135, 84, 0.08 );
    }



    /* =========================================================
           CAMPO NO DISPONIBLE
           ========================================================= */

    .formulario-principal
    input.campo-no-disponible {
        border-color: #dc3545;
        background-color: #fff8f8;
        box-shadow: 0 0 0 3px rgba( 220, 53, 69, 0.10 );
    }



    /* =========================================================
           BOTON CREAR
           ========================================================= */

    .formulario-principal
    button[type="submit"] {
        width: 100%;
        min-height: 48px;
        border: none;
        border-radius: 8px;
        background-color: #1198a5;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }


        .formulario-principal
        button[type="submit"]:hover {
            background-color: #0d8490;
        }



    /* =========================================================
           VOLVER
           ========================================================= */

    .contenedor-volver {
        display: flex;
        justify-content: center;
        margin-top: 30px;
        margin-bottom: 30px;
    }


    .btn-volver-usuarios {
        display: inline-block;
        padding: 12px 22px;
        background-color: #1198a5;
        color: white;
        border-radius: 7px;
        text-decoration: none;
        font-weight: 600;
    }


        .btn-volver-usuarios:hover {
            background-color: #0d8490;
            color: white;
        }



    /* =========================================================
           MODAL
           ========================================================= */

    .modal-fondo {
        display: none;
        position: fixed;
        inset: 0;
        background-color: rgba( 0, 0, 0, 0.45 );
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }


    .modal-contenido {
        width: 90%;
        max-width: 430px;
        padding: 30px;
        background-color: white;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 12px 35px rgba( 0, 0, 0, 0.25 );
    }


    .modal-icono {
        width: 55px;
        height: 55px;
        margin: 0 auto 15px auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1198a5;
        color: white;
        border-radius: 50%;
        font-size: 30px;
        font-weight: bold;
    }


    .modal-contenido h2 {
        margin-top: 0;
        color: #003b64;
    }


    .modal-contenido p {
        margin-top: 15px;
        margin-bottom: 25px;
        font-size: 17px;
        color: #444;
    }


    .modal-botones {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }


        .modal-botones button {
            min-width: 90px;
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }


    .btn-modal-si {
        background-color: #198754;
    }


        .btn-modal-si:hover {
            background-color: #157347;
        }


    .btn-modal-no {
        background-color: #c82333;
    }


        .btn-modal-no:hover {
            background-color: #a91d2a;
        }


    .btn-modal-cancelar {
        background-color: #59636b;
    }


        .btn-modal-cancelar:hover {
            background-color: #474f55;
        }

</style>


</main><link rel="stylesheet" href="/css/sarmedix-global.css"><script>document.addEventListener("submit",e=>e.preventDefault());document.querySelectorAll("a").forEach(a=>a.removeAttribute("href"));</script></body></html>
